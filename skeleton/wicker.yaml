# Wicker application manifest (wicker-app/v1).
#
# This skeleton was generated by `wicker init`. Fill in the sections you
# need and delete the rest — only the four keys below the header are
# required; every other section is optional. Validate as you go:
#
#     wicker validate .
#
# and preview a deploy without touching Docker or canasta:
#
#     wicker deploy <app-dir> -i <id> -n <domain> --dry-run
#
apiVersion: wicker-app/v1
name: {{name}}
version: 0.1.0
description: {{description}}
# author: Your Name
# homepage: https://github.com/you/{{name}}
# license: GPL-2.0-or-later

# Minimum Canasta version this app needs (documentation only for now).
# requires:
#   canasta: ">=3.5"

# The wikis in this instance (required). The first entry is the primary
# wiki: its `id` names the instance. Add more entries to build a wiki farm;
# the first wiki is where `content.uploads` top-level files land. Each wiki
# may set `siteName` (the $wgSitename display name; defaults to the id).
# Domains are NOT set here — they are passed at deploy time via
# `-n/--domain-name` (one per wiki, in this order), e.g. for the farm below:
#   wicker deploy . -i myapp -n localhost,localhost/docs
wikis:
  - id: main
#    siteName: My Wiki
#  - id: docs
#    siteName: Docs

# Every extension the app uses, bundled and custom together. An entry
# with only a `name` is a Canasta-bundled extension (your settings
# fragment is expected to load it). An entry with `source:` (a local path)
# or `git:` (a URL) is a custom extension Wicker installs into the
# instance. See extensions/README.md.
# extensions:
#   - name: PageForms
#   - name: Cargo
#   - name: MyExtension
#     source: ./extensions/MyExtension
#   - name: CreateUserPage
#     git: https://github.com/wikimedia/mediawiki-extensions-CreateUserPage.git
#     ref: master

# Every skin the app uses, bundled and custom together. An entry with only
# a `name` is a Canasta-bundled skin (your settings fragment is expected to
# load it). An entry with `source:` (a local path) or `git:` (a URL) is a
# custom skin Wicker installs into the instance. See skins/README.md.
# skins:
#   - name: Vector
#   - name: MySkin
#     source: ./skins/MySkin
#   - name: SomeUpstream
#     git: https://github.com/example/SomeUpstream.git
#     ref: master

# Derived images for the two services Canasta can point at a custom image:
# web (e.g. OS packages, php.ini knobs) and elasticsearch (e.g. an analysis
# plugin for an alternate collation). Additional containers belong under
# sidecars:. See images/README.md.
# images:
#   web:
#     dockerfile: ./images/web/Dockerfile
#     context: ./images/web
#   elasticsearch:
#     dockerfile: ./images/elasticsearch/Dockerfile

# Instance environment variables, written to the instance .env. Values
# support ${VAR:-default} interpolation from the deploy environment, so a
# shared secret resolves to the same value here and in a sidecar's env.
# Not a secret store — values land in plaintext.
# env:
#   MY_APP_SHARED_SECRET: "${MY_APP_SHARED_SECRET:-}"

# Secrets the app needs at deploy time. Declare name + target here; supply the
# VALUE with `wicker deploy --secret KEY=VALUE` (or from the environment). The
# value is written to the instance .env, never stored in the manifest. Targets:
# `sidecar:<name>` (delivered to that sidecar, withheld from the web tier),
# `web` (re-exported to MediaWiki getenv()), `env` (instance .env only).
# secrets:
#   - name: MY_SERVICE_TOKEN
#     target: [sidecar:my-service]
#   - name: MY_APP_SHARED_SECRET
#     target: [web, sidecar:my-service]
#     required: false

# Companion containers, declared once in Canasta's orchestrator-agnostic
# schema and deployed identically on Compose and k8s. See sidecars/README.md.
# sidecars:
#   - name: my-service
#     build: ./sidecars/my-service
#     ports: [8000]
#     env:
#       MY_APP_SHARED_SECRET: "${MY_APP_SHARED_SECRET:-}"
#     healthcheck:
#       path: /health
#       port: 8000

# Operator settings fragments, installed into the instance. See settings/README.md.
# settings:
#   - path: ./settings/Settings.php
#     install: config/settings/global/Settings.php

# Static files copied into the instance's public_assets/ (logos, favicons,
# robots.txt, …), served directly by the web tier. The tree is copied
# verbatim, so per-wiki assets go under a <wiki>/ subdirectory.
# See public_assets/README.md.
# publicAssets: ./public_assets

# Starter wiki content and post-install maintenance. See content/README.md.
# content:
#   pages:
#     dir: ./content/pages
#     list:
#       - Main Page
#       - Template:Example
#   uploads:                    # media uploaded via importImages.php (Compose-only)
#     dir: ./content/uploads    # loose files -> first wiki; <wiki-id>/ -> that wiki
#   postInstall:
#     - kind: update            # run update.php
#     - kind: maintenance       # run an extension/core maintenance script
#       extension: Cargo
#       script: cargoRecreateData.php
#       args: ["--table=Example"]

# Versioned migrations for USER content, run by `wicker upgrade` (entries
# with installed-version < to <= manifest version, ascending; cumulative).
# Shipped pages are reconciled separately — these steps rewrite pages the
# app did NOT ship.
# migrations:
#   - to: 2.0.0
#     description: Expense template rework
#     steps:
#       - kind: template-calls    # rewrite every call of a template
#         template: Example
#         transforms:
#           - op: rename-param    # value untouched
#             from: cost
#             to: amount
#           - op: add-param       # literal value, or from: <other-param>
#             name: currency
#             value: USD
#           - op: map-values      # exact-match rewrite; unmapped reported
#             name: category
#             map: {Food: Meals}
#       - kind: maintenance       # then rebuild derived storage
#         extension: Cargo
#         script: cargoRecreateData.php
#         args: ["--table=Example"]
#       - kind: update
